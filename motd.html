<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тюремный Блок | JailBreak | CSS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #111112;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .card {
            width: 800px;
            background-color: #19191a;
            border-radius: 10px;
            border: 1px solid #333335;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            overflow: hidden;
            text-align: center;
        }
        .cover {
            width: 100%;
            height: 240px;
            background: #222 url('https://sun9-28.userapi.com/impf/...') center/cover no-repeat;
            background-color: #262628;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            border-bottom: 2px solid #5181b8;
        }
        .info {
            padding: 20px;
        }
        .server-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .ip-badge {
            display: inline-block;
            background: #29292d;
            color: #4bb34b;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            border: 1px solid #3e3e42;
        }
        .text {
            color: #828286;
            font-size: 14px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="cover">
            ТЮРЕМНЫЙ БЛОК | JAILBREAK | CSS
        </div>
        <div class="info">
            <div class="server-title">Официальное сообщество сервера</div>
            <div class="ip-badge">IP: 46.174.49.59:27209</div>
            <p class="text">vk.com/prisonblock</p>
        </div>
    </div>
</body>
</html>
